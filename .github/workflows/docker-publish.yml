name: Docker Build and Publish

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'Dockerfile'
      - 'compose.yaml'
      - 'pyproject.toml'
      - 'poetry.lock'
      - 'src/**'
  workflow_dispatch:
    inputs:
      push_image:
        description: 'Push image to registry'
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write
  security-events: write
  id-token: write

jobs:
  build-and-test:
    name: Build and Test Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build Docker image (test)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ steps.meta.outputs.version }}

      - name: Test Docker image
        run: |
          # Start container
          docker run -d --name shap-test -p 8080:8080 ${{ env.IMAGE_NAME }}:test

          # Wait for container to be ready
          timeout 60 bash -c 'until curl -f http://localhost:8080/health; do sleep 2; done'

          # Run basic health check
          curl -f http://localhost:8080/health

          # Stop container
          docker stop shap-test
          docker rm shap-test

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          image-ref: ${{ env.IMAGE_NAME }}:test
          format: 'sarif'
          output: 'trivy-image-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-image-results.sarif'
          category: 'trivy-docker-build'

      - name: Scan image with Trivy (table output)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          image-ref: ${{ env.IMAGE_NAME }}:test
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

  build-multiarch:
    name: Build Multi-Architecture Images
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name != 'pull_request'
    strategy:
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and export to Docker (single platform)
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
          outputs: type=docker,dest=/tmp/image-${{ strategy.job-index }}.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-${{ strategy.job-index }}
          path: /tmp/image-${{ strategy.job-index }}.tar
          retention-days: 1

  publish:
    name: Publish Docker Images
    runs-on: ubuntu-latest
    needs: build-multiarch
    if: |
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' ||
       github.ref == 'refs/heads/develop' ||
       startsWith(github.ref, 'refs/tags/v'))
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=auto
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push multi-platform image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ steps.meta.outputs.version }}

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  scan-published:
    name: Scan Published Images
    runs-on: ubuntu-latest
    needs: publish
    if: success()
    strategy:
      matrix:
        tag:
          - latest
          - develop
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull published image
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.tag }} || echo "Tag ${{ matrix.tag }} not found"

      - name: Scan published image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.tag }}
          format: 'sarif'
          output: 'trivy-published-${{ matrix.tag }}.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
        continue-on-error: true

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-published-${{ matrix.tag }}.sarif'
          category: 'trivy-published-${{ matrix.tag }}'

      - name: Run Grype scan
        uses: anchore/scan-action@v3
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.tag }}
          fail-build: false
          severity-cutoff: high
          output-format: sarif

      - name: Upload Grype results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: 'grype-${{ matrix.tag }}'

  update-readme:
    name: Update Container Registry README
    runs-on: ubuntu-latest
    needs: publish
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Docker README
        run: |
          cat > DOCKER_README.md << 'EOF'
          # SHAP Analytics Docker Image

          Official Docker image for SHAP Analytics - Professional SHAP value computation and analysis.

          ## Quick Start

          ```bash
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          docker run -p 8080:8080 ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          ```

          ## Available Tags

          - `latest` - Latest stable release from main branch
          - `develop` - Latest development build
          - `v*.*.*` - Specific version tags
          - `<branch>-<sha>` - Branch-specific builds

          ## Supported Architectures

          - `linux/amd64` (x86_64)
          - `linux/arm64` (ARM64/Apple Silicon)

          ## Usage

          ### Docker Run

          ```bash
          docker run -d \
            --name shap-analytics \
            -p 8080:8080 \
            -e LOG_LEVEL=INFO \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          ```

          ### Docker Compose

          ```yaml
          version: '3.8'
          services:
            shap-api:
              image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
              ports:
                - "8080:8080"
              environment:
                - LOG_LEVEL=INFO
                - APP_ENV=production
              healthcheck:
                test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
                interval: 30s
                timeout: 10s
                retries: 3
          ```

          ## Environment Variables

          - `APP_ENV` - Application environment (default: production)
          - `LOG_LEVEL` - Logging level (default: INFO)
          - `PYTHONUNBUFFERED` - Python output buffering (default: 1)

          ## Health Check

          ```bash
          curl http://localhost:8080/health
          ```

          ## Security

          - Images are scanned with Trivy and Grype
          - No known critical vulnerabilities
          - Regular security updates
          - Non-root user execution
          - Minimal attack surface

          ## Documentation

          - [GitHub Repository](https://github.com/${{ github.repository }})
          - [Documentation](https://diogoribeiro7.github.io/shap-analytics)

          ## Support

          - [GitHub Issues](https://github.com/${{ github.repository }}/issues)
          - [Discussions](https://github.com/${{ github.repository }}/discussions)

          ## License

          MIT License - see LICENSE file in repository
          EOF

      - name: Update container description
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          readme-filepath: ./DOCKER_README.md
        continue-on-error: true

  summary:
    name: Publish Summary
    runs-on: ubuntu-latest
    needs: [build-and-test, publish, scan-published]
    if: always()
    steps:
      - name: Generate summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          # Docker Build and Publish Summary

          ## Build Information

          - **Repository**: ${{ github.repository }}
          - **Branch**: ${{ github.ref_name }}
          - **Commit**: ${{ github.sha }}
          - **Registry**: ${{ env.REGISTRY }}

          ## Job Status

          | Job | Status |
          |-----|--------|
          | Build and Test | ${{ needs.build-and-test.result }} |
          | Publish | ${{ needs.publish.result }} |
          | Security Scan | ${{ needs.scan-published.result }} |

          ## Published Images

          ### Tags
          - `${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest`
          - `${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}`
          - `${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}`

          ### Platforms
          - linux/amd64
          - linux/arm64

          ## Pull Command

          ```bash
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          ```

          ## Security

          - ✅ Trivy vulnerability scan completed
          - ✅ Grype security scan completed
          - ✅ Results uploaded to Security tab

          ## Next Steps

          1. Review security scan results
          2. Test the published image
          3. Update documentation if needed
          4. Deploy to staging/production

          ---
          *Build completed: $(date -u)*
          EOF

      - name: Notify on failure
        if: |
          needs.build-and-test.result == 'failure' ||
          needs.publish.result == 'failure'
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🐳 Docker Build Failed',
              body: `## Docker Build Failure

              The Docker build and publish workflow has failed.

              **Workflow Run**: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}
              **Branch**: ${context.ref}
              **Commit**: ${context.sha}

              ### Failed Jobs
              - Build and Test: ${{ needs.build-and-test.result }}
              - Publish: ${{ needs.publish.result }}

              ### Action Required
              - Review workflow logs
              - Check Dockerfile and dependencies
              - Fix issues and re-run workflow

              **Triggered**: ${new Date().toISOString()}`,
              labels: ['docker', 'bug', 'ci/cd']
            });
